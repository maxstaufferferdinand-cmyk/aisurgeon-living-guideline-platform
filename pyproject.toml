[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisurgeon-living-guideline-platform"
version = "0.1.0"
description = "Source-bound infrastructure for the AISurgeon Living Guideline Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
]

[project.scripts]
aisurgeon = "aisurgeon.cli.app:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aisurgeon"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

